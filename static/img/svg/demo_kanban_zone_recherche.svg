<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7cd1f"/>
      <stop offset="1" stop-color="#e0b400"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; }
      .card-title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; }
      .card-desc { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- Fond blanc -->
  <rect x="0" y="0" width="720" height="460" rx="28" fill="#ffffff"/>
  <rect x="1" y="1" width="718" height="458" rx="27" fill="none" stroke="#e7e9ef" stroke-width="2"/>

  <!-- Pointillés décoratifs -->
  <g fill="#c9d6f2">
    <circle cx="34" cy="34" r="3"/><circle cx="50" cy="34" r="3"/><circle cx="66" cy="34" r="3"/>
    <circle cx="34" cy="50" r="3"/><circle cx="50" cy="50" r="3"/><circle cx="66" cy="50" r="3"/>
    <circle cx="34" cy="66" r="3"/><circle cx="50" cy="66" r="3"/><circle cx="66" cy="66" r="3"/>
  </g>
  <g fill="#c9d6f2">
    <circle cx="654" cy="34" r="3"/><circle cx="670" cy="34" r="3"/><circle cx="686" cy="34" r="3"/>
    <circle cx="654" cy="50" r="3"/><circle cx="670" cy="50" r="3"/><circle cx="686" cy="50" r="3"/>
    <circle cx="654" cy="66" r="3"/><circle cx="670" cy="66" r="3"/><circle cx="686" cy="66" r="3"/>
  </g>

  <!-- Titre -->
  <text x="360" y="62" text-anchor="middle" class="title" font-size="30" fill="#1f2a44" letter-spacing="1">DÉMO KANBAN ET RECHERCHE</text>

  <!-- Carte couleur avec icône -->
  <rect x="40" y="110" width="640" height="300" rx="18" fill="url(#bg)"/>
  <circle cx="360" cy="215" r="55" fill="#ffffff"/>

  <!-- icone kanban + loupe -->
  <g fill="#e0b400">
    <rect x="326" y="188" width="14" height="42" rx="4"/>
    <rect x="346" y="196" width="14" height="34" rx="4"/>
    <rect x="366" y="204" width="14" height="26" rx="4"/>
  </g>
  <g fill="none" stroke="#e0b400" stroke-width="5" stroke-linecap="round">
    <circle cx="366" cy="218" r="12"/>
    <line x1="375" y1="227" x2="386" y2="238"/>
  </g>

  <text x="360" y="330" text-anchor="middle" class="card-title" font-size="26" fill="#1f2a44">Tableau de bord de test</text>
</svg>
