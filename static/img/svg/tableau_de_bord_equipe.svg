<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; }
      .card-title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; }
      .card-desc { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 400; }
      .btn-label { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; }
    </style>
  </defs>

  <!-- Fond -->
  <rect x="0" y="0" width="720" height="460" rx="28" fill="#ffffff"/>
  <rect x="1" y="1" width="718" height="458" rx="27" fill="none" stroke="#e7e9ef" stroke-width="2"/>

  <!-- Décor pointillés coins -->
  <g fill="#c9d6f2">
    <circle cx="34" cy="34" r="3"/><circle cx="50" cy="34" r="3"/><circle cx="66" cy="34" r="3"/>
    <circle cx="34" cy="50" r="3"/><circle cx="50" cy="50" r="3"/><circle cx="66" cy="50" r="3"/>
    <circle cx="34" cy="66" r="3"/><circle cx="50" cy="66" r="3"/><circle cx="66" cy="66" r="3"/>
  </g>
  <g fill="#c9d6f2">
    <circle cx="654" cy="34" r="3"/><circle cx="670" cy="34" r="3"/><circle cx="686" cy="34" r="3"/>
    <circle cx="654" cy="50" r="3"/><circle cx="670" cy="50" r="3"/><circle cx="686" cy="50" r="3"/>
    <circle cx="654" cy="66" r="3"/><circle cx="670" cy="66" r="3"/><circle cx="686" cy="66" r="3"/>
  </g>

  <!-- Titre -->
  <text x="360" y="62" text-anchor="middle" class="title" font-size="30" fill="#1f2a44" letter-spacing="1">TABLEAU DE BORD D'ÉQUIPE</text>

  <!-- ===================== Carte 1 : Agenda ===================== -->
  <g>
    <rect x="40" y="110" width="196" height="300" rx="18" fill="#e8f1fd"/>
    <circle cx="138" cy="182" r="38" fill="#4f8ff7"/>
    <!-- icone calendrier -->
    <g fill="#ffffff">
      <rect x="118" y="168" width="40" height="34" rx="4"/>
      <rect x="118" y="168" width="40" height="10" rx="4" fill="#3a6fd1"/>
      <rect x="124" y="160" width="4" height="12" rx="2"/>
      <rect x="148" y="160" width="4" height="12" rx="2"/>
      <circle cx="127" cy="188" r="2.4" fill="#3a6fd1"/>
      <circle cx="138" cy="188" r="2.4" fill="#3a6fd1"/>
      <circle cx="149" cy="188" r="2.4" fill="#3a6fd1"/>
      <circle cx="127" cy="196" r="2.4" fill="#3a6fd1"/>
      <circle cx="138" cy="196" r="2.4" fill="#3a6fd1"/>
    </g>
    <text x="138" y="252" text-anchor="middle" class="card-title" font-size="19" fill="#1f2a44">AGENDA</text>
    <text x="138" y="278" text-anchor="middle" class="card-desc" font-size="12.5" fill="#5b6478">Consulter l'emploi du</text>
    <text x="138" y="296" text-anchor="middle" class="card-desc" font-size="12.5" fill="#5b6478">temps et les rendez-vous</text>
    <rect x="58" y="356" width="160" height="36" rx="18" fill="#4f8ff7"/>
    <text x="138" y="379" text-anchor="middle" class="btn-label" font-size="11.5" fill="#ffffff" letter-spacing="0.5">ACCÉDER À L'AGENDA</text>
  </g>

  <!-- ===================== Carte 2 : Activités ===================== -->
  <g>
    <rect x="262" y="110" width="196" height="300" rx="18" fill="#fdf0e1"/>
    <circle cx="360" cy="182" r="38" fill="#f2994a"/>
    <!-- icone engrenage -->
    <g fill="#ffffff">
      <path d="M360 160
               l4.5 0 1.6 7.4 5.6 2.3 6.3-4.2 3.2 3.2-4.2 6.3 2.3 5.6 7.4 1.6 0 4.5
               -7.4 1.6 -2.3 5.6 4.2 6.3 -3.2 3.2 -6.3-4.2 -5.6 2.3 -1.6 7.4 -4.5 0
               -1.6-7.4 -5.6-2.3 -6.3 4.2 -3.2-3.2 4.2-6.3 -2.3-5.6 -7.4-1.6 0-4.5
               7.4-1.6 2.3-5.6 -4.2-6.3 3.2-3.2 6.3 4.2 5.6-2.3 1.6-7.4z"/>
      <circle cx="360" cy="182" r="11" fill="#d97a2c"/>
    </g>
    <text x="360" y="252" text-anchor="middle" class="card-title" font-size="19" fill="#1f2a44">ACTIVITÉS</text>
    <text x="360" y="278" text-anchor="middle" class="card-desc" font-size="12.5" fill="#5b6478">Suivre les projets, tâches</text>
    <text x="360" y="296" text-anchor="middle" class="card-desc" font-size="12.5" fill="#5b6478">et la progression</text>
    <rect x="280" y="356" width="160" height="36" rx="18" fill="#f2994a"/>
    <text x="360" y="379" text-anchor="middle" class="btn-label" font-size="11.5" fill="#ffffff" letter-spacing="0.5">VOIR LES ACTIVITÉS</text>
  </g>

  <!-- ===================== Carte 3 : S.A.V. & Support ===================== -->
  <g>
    <rect x="484" y="110" width="196" height="300" rx="18" fill="#e3f5f0"/>
    <circle cx="582" cy="182" r="38" fill="#2bb99c"/>
    <!-- icone casque support -->
    <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round">
      <path d="M566 184 a16 16 0 0 1 32 0"/>
    </g>
    <g fill="#ffffff">
      <rect x="561" y="182" width="9" height="16" rx="4"/>
      <rect x="594" y="182" width="9" height="16" rx="4"/>
      <path d="M570 198 q0 12 12 12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="583" cy="210" r="3.2"/>
    </g>
    <text x="582" y="252" text-anchor="middle" class="card-title" font-size="17" fill="#1f2a44">S.A.V. &amp; SUPPORT</text>
    <text x="582" y="278" text-anchor="middle" class="card-desc" font-size="12" fill="#5b6478">Gérer les tickets, le service</text>
    <text x="582" y="296" text-anchor="middle" class="card-desc" font-size="12" fill="#5b6478">après-vente et l'aide</text>
    <rect x="502" y="356" width="160" height="36" rx="18" fill="#2bb99c"/>
    <text x="582" y="379" text-anchor="middle" class="btn-label" font-size="11.5" fill="#ffffff" letter-spacing="0.5">OUVRIR LE S.A.V.</text>
  </g>
</svg>
